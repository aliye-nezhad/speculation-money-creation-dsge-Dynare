name: Dynare reproducibility

on:
  push:
    branches: [main, matlab-only-reproducibility]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dynare-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replicate:
    name: Run four DSGE calibrations in MATLAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify committed DSGE source files are unchanged
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- models/*.mod

      - name: Set up MATLAB R2023b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b

      - name: Install pinned Dynare runtime
        run: |
          timeout 5m sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes --no-install-recommends dynare=6.0-1 gnuplot-nox ghostscript

          DYNARE_PATH="$(dpkg -L dynare | grep '/matlab$' | head -n 1)"
          test -n "$DYNARE_PATH"
          test -f "$DYNARE_PATH/dynare.m"
          test -x "$DYNARE_PATH/../preprocessor/dynare-preprocessor"
          echo "DYNARE_PATH=$DYNARE_PATH" >> "$GITHUB_ENV"

          SYSTEM_LIBSTDCXX="$(ldconfig -p | grep 'libstdc++.so.6' | grep 'x86-64' | awk '{print $NF; exit}')"
          test -f "$SYSTEM_LIBSTDCXX"
          strings "$SYSTEM_LIBSTDCXX" | grep -Fxq 'GLIBCXX_3.4.32'
          echo "SYSTEM_LIBSTDCXX=$SYSTEM_LIBSTDCXX" >> "$GITHUB_ENV"
          echo "System C++ runtime: $SYSTEM_LIBSTDCXX"
          dpkg-query -W -f='Dynare ${Version}\n' dynare

      - name: Set up Python for independent output validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all four model calibrations in MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: system_libstdcxx = getenv('SYSTEM_LIBSTDCXX'); assert(isfile(system_libstdcxx), 'System C++ runtime was not found.'); setenv('LD_PRELOAD', system_libstdcxx); assert(strcmp(version('-release'), '2023b'), 'This workflow requires MATLAB R2023b.'); addpath(getenv('DYNARE_PATH')); fprintf('MATLAB release: %s\n', version('-release')); fprintf('Preloaded C++ runtime: %s\n', getenv('LD_PRELOAD')); run('replication/run_all.m');

      - name: Validate generated impulse responses
        run: python replication/validate_outputs.py

      - name: Upload generated results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynare-matlab-replication-${{ github.sha }}
          path: outputs/replication/
          if-no-files-found: warn
          retention-days: 30
