name: MATLAB and Dynare reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dynare-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DYNARE_VERSION: "6.0"
  DYNARE_MLTBX_URL: https://www.dynare.org/release/matlab-online/dynare-6.0.mltbx
  DYNARE_MLTBX_SHA256_EXPECTED: 2b09418d141ba3fd077cf2cb97f3aa478a4adf60db11f1ff3f9ec5840da6903f

jobs:
  replicate:
    name: Run and validate four DSGE calibrations in MATLAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Check model files and MATLAB setup
        shell: bash
        run: |
          set -euo pipefail

          while read -r expected_blob model_file; do
            case "$expected_blob" in
              ""|\#*) continue ;;
            esac

            test -f "$model_file"
            actual_blob="$(git hash-object "$model_file")"
            if [ "$actual_blob" != "$expected_blob" ]; then
              echo "::error::Preserved model source changed: $model_file"
              echo "Expected Git blob: $expected_blob"
              echo "Actual Git blob:   $actual_blob"
              exit 1
            fi
              echo "$model_file matches its recorded Git blob ID."
          done < models/SOURCE_BLOBS.sha1

          if git ls-files '*.py' '*.pyc' | grep -q .; then
            echo "::error::Python source or bytecode files are present in the repository."
            git ls-files '*.py' '*.pyc'
            exit 1
          fi

          if grep -R -nE '(^|[[:space:]])python(3)?([[:space:]]|$)' \
              .github/workflows replication; then
            echo "::error::A replication file contains a Python command."
            exit 1
          fi

          if command -v octave >/dev/null 2>&1; then
            echo "::error::The MATLAB environment must be set up without Octave."
            exit 1
          fi

      - name: Install MATLAB and plotting system dependencies
        shell: bash
        run: |
          set -euo pipefail

          mirror_ok=0
          for mirror in \
            https://mirrors.edge.kernel.org/ubuntu \
            https://ftp.lysator.liu.se/ubuntu \
            https://mirror.ossplanet.net/ubuntu; do
            printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            if timeout 3m sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
              -o APT::Update::Error-Mode=any \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20; then
              echo "Using Ubuntu package mirror: $mirror"
              mirror_ok=1
              break
            fi
            echo "Mirror unavailable; trying the next Ubuntu mirror."
          done

          if [ "$mirror_ok" -ne 1 ]; then
            echo "::error::Unable to update Ubuntu package indexes from the configured mirrors."
            exit 1
          fi

          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            ghostscript gnuplot-nox x13as locales-all \
            libflac12t64 libgstreamer-plugins-base1.0-0 libmp3lame0 \
            libmpg123-0t64 libopus0 liborc-0.4-0t64 libsndfile1 \
            libvorbisenc2

          if command -v octave >/dev/null 2>&1; then
            echo "::error::An OS dependency unexpectedly installed Octave."
            exit 1
          fi

          system_libstdcxx="$(ldconfig -p | grep 'libstdc++.so.6' | grep 'x86-64' | awk '{print $NF; exit}')"
          test -f "$system_libstdcxx"
          strings "$system_libstdcxx" | grep -Fxq 'GLIBCXX_3.4.32'
          echo "SYSTEM_LIBSTDCXX=$system_libstdcxx" >> "$GITHUB_ENV"
          echo "System C++ runtime: $system_libstdcxx"

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # matlab-actions/setup-matlab v3
        with:
          release: R2024b
          cache: false
          install-system-dependencies: false

      - name: Download and verify the official Dynare 6.0 MATLAB toolbox
        shell: bash
        run: |
          set -euo pipefail

          toolbox_path="$RUNNER_TEMP/dynare-6.0.mltbx"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            "$DYNARE_MLTBX_URL" \
            --output "$toolbox_path"

          test -s "$toolbox_path"
          unzip -tq "$toolbox_path"

          toolbox_sha256="$(sha256sum "$toolbox_path" | awk '{print $1}')"
          if [ "$toolbox_sha256" != "$DYNARE_MLTBX_SHA256_EXPECTED" ]; then
            echo "::error::Dynare toolbox checksum differs from the expected SHA-256."
            echo "Expected: $DYNARE_MLTBX_SHA256_EXPECTED"
            echo "Actual:   $toolbox_sha256"
            exit 1
          fi
          echo "DYNARE_MLTBX_PATH=$toolbox_path" >> "$GITHUB_ENV"
          echo "DYNARE_MLTBX_SHA256=$toolbox_sha256" >> "$GITHUB_ENV"
          echo "Dynare $DYNARE_VERSION MATLAB toolbox SHA-256: $toolbox_sha256"

      - name: Install Dynare and run the four calibrations in MATLAB
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # matlab-actions/run-command v3
        with:
          command: |
            system_libstdcxx = getenv('SYSTEM_LIBSTDCXX');
            assert(isfile(system_libstdcxx), 'System C++ runtime was not found.');
            setenv('LD_PRELOAD', system_libstdcxx);
            assert(strcmp(version('-release'), '2024b'), 'Use MATLAB R2024b for this run.');
            toolbox_file = getenv('DYNARE_MLTBX_PATH');
            assert(isfile(toolbox_file), 'Dynare MATLAB toolbox file was not found.');
            matlab.addons.install(toolbox_file, true);
            rehash;
            dynare_file = which('dynare');
            assert(~isempty(dynare_file), 'Dynare toolbox installed, but dynare.m is not on the MATLAB path.');
            dynare_path = fileparts(dynare_file);
            addpath(genpath(dynare_path));
            addpath(genpath(fullfile(dynare_path, 'missing', 'mex')));
            assert(exist('dynare', 'file') == 2, 'Dynare is not on the MATLAB path.');
            assert(exist('num_procs', 'file') == 2 || exist('num_procs', 'file') == 3, 'Dynare processor-count routine is unavailable.');
            assert(exist('mjdgges', 'file') == 2 || exist('mjdgges', 'file') == 3, 'Dynare generalized Schur routine is unavailable.');
            run('replication/run_all.m');

      - name: Record software versions and model checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256sum models/speculation_money_creation_q02.mod \
            models/speculation_money_creation_q04.mod \
            models/speculation_money_creation_q06.mod \
            models/speculation_money_creation_q08.mod \
            > outputs/replication/source_model_sha256.txt

          {
            echo "Source commit: $GITHUB_SHA"
            echo "System OS: $RUNNER_OS"
            echo "System image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "Operating system: $(. /etc/os-release && printf '%s' "$PRETTY_NAME")"
            echo "Kernel: $(uname -sr)"
            echo "Dynare version: $DYNARE_VERSION"
            echo "Dynare MATLAB toolbox URL: $DYNARE_MLTBX_URL"
            echo "Dynare MATLAB toolbox SHA-256: $DYNARE_MLTBX_SHA256"
            echo "Octave executable: absent"
            echo
            echo "MATLAB runtime manifest:"
            cat outputs/replication/runtime_manifest.txt
            echo
            echo "Installed system package versions:"
            dpkg-query -W -f='${binary:Package}\t${Version}\n' \
              ghostscript gnuplot-nox x13as locales-all libstdc++6 \
              libflac12t64 libgstreamer-plugins-base1.0-0 libmp3lame0 \
              libmpg123-0t64 libopus0 liborc-0.4-0t64 libsndfile1 \
              libvorbisenc2 | sort
          } > outputs/replication/environment_manifest.txt

      - name: Plot responses and compare results
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # matlab-actions/run-command v3
        with:
          command: |
            system_libstdcxx = getenv('SYSTEM_LIBSTDCXX');
            setenv('LD_PRELOAD', system_libstdcxx);
            dynare_file = which('dynare');
            assert(~isempty(dynare_file), 'Installed Dynare toolbox is not available in this MATLAB session.');
            dynare_path = fileparts(dynare_file);
            addpath(genpath(dynare_path));
            addpath(genpath(fullfile(dynare_path, 'missing', 'mex')));
            run('replication/plot_irfs.m');
            run('replication/validate_outputs.m');

      - name: Archive the replication results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6
        with:
          name: dynare-matlab-replication-${{ github.sha }}-${{ github.run_attempt }}
          path: outputs/replication/
          if-no-files-found: warn
          retention-days: 90

      - name: Save the replication results
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "::warning::main moved during the run. The results are attached to this run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            outputs/replication/irfs_q*.csv \
            outputs/replication/irf_impact_summary.csv \
            outputs/replication/runtime_manifest.txt \
            outputs/replication/environment_manifest.txt \
            outputs/replication/source_model_sha256.txt \
            outputs/replication/validation_report.txt \
            outputs/replication/figures/*.png

          if git diff --cached --quiet; then
            echo "The results match the files already in the repository."
            exit 0
          fi

          git commit -m "Update thesis replication results" -m "[skip ci]"
          git push origin HEAD:main
