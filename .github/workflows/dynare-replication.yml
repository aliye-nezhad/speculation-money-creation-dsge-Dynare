name: Dynare reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dynare-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replicate:
    name: Run four DSGE calibrations in MATLAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify committed DSGE source files are unchanged
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- models/*.mod

      - name: Install MATLAB runtime dependencies
        run: |
          mirror_ok=0
          for mirror in \
            https://mirrors.edge.kernel.org/ubuntu \
            https://ftp.lysator.liu.se/ubuntu \
            https://mirror.ossplanet.net/ubuntu; do
            printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            if timeout 3m sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
              -o APT::Update::Error-Mode=any \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20; then
              echo "Using Ubuntu package mirror: $mirror"
              mirror_ok=1
              break
            fi
            echo "Mirror unavailable; trying the next Ubuntu mirror."
          done

          if [ "$mirror_ok" -ne 1 ]; then
            echo "Unable to update Ubuntu package indexes from the configured mirrors."
            exit 1
          fi

          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            libflac12t64 libgstreamer-plugins-base1.0-0 libmp3lame0 \
            libmpg123-0t64 libopus0 liborc-0.4-0t64 libsndfile1 \
            libvorbisenc2 locales-all

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
          install-system-dependencies: false

      - name: Install pinned Dynare runtime
        run: |
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            dynare=6.0-1 gnuplot-nox ghostscript

          # Extract the MATLAB interface without invoking Ubuntu's
          # matlab-support registration hook. MATLAB Actions keeps MATLAB
          # in the runner tool cache rather than a system installation path.
          cd "$RUNNER_TEMP"
          apt-get download dynare-matlab=6.0-1
          mkdir -p "$RUNNER_TEMP/dynare-matlab"
          dpkg-deb -x dynare-matlab_6.0-1_all.deb "$RUNNER_TEMP/dynare-matlab"
          DYNARE_PATH="$(dirname "$(find "$RUNNER_TEMP/dynare-matlab" -type f -name dynare.m -print -quit)")"
          test -n "$DYNARE_PATH"
          test -f "$DYNARE_PATH/dynare.m"

          DYNARE_PREPROCESSOR="$(dpkg -L dynare | grep '/dynare-preprocessor$' | head -n 1)"
          test -n "$DYNARE_PREPROCESSOR"
          test -x "$DYNARE_PREPROCESSOR"
          echo "DYNARE_PATH=$DYNARE_PATH" >> "$GITHUB_ENV"

          SYSTEM_LIBSTDCXX="$(ldconfig -p | grep 'libstdc++.so.6' | grep 'x86-64' | awk '{print $NF; exit}')"
          test -f "$SYSTEM_LIBSTDCXX"
          strings "$SYSTEM_LIBSTDCXX" | grep -Fxq 'GLIBCXX_3.4.32'
          echo "SYSTEM_LIBSTDCXX=$SYSTEM_LIBSTDCXX" >> "$GITHUB_ENV"
          echo "System C++ runtime: $SYSTEM_LIBSTDCXX"
          dpkg-query -W -f='Dynare ${Version}\\n' dynare

      - name: Set up Python for independent output validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all four model calibrations in MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            system_libstdcxx = getenv('SYSTEM_LIBSTDCXX');
            assert(isfile(system_libstdcxx), 'System C++ runtime was not found.');
            setenv('LD_PRELOAD', system_libstdcxx);
            assert(strcmp(version('-release'), '2024b'), 'This workflow requires MATLAB R2024b.');
            addpath(getenv('DYNARE_PATH'));
            fprintf('MATLAB release: %s\\n', version('-release'));
            fprintf('Preloaded C++ runtime: %s\\n', getenv('LD_PRELOAD'));
            run('replication/run_all.m');

      - name: Validate generated impulse responses
        run: python replication/validate_outputs.py

      - name: Upload generated results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynare-matlab-replication-${{ github.sha }}
          path: outputs/replication/
          if-no-files-found: warn
          retention-days: 30
 | head -n 1)"
          test -n "$DYNARE_PREPROCESSOR"
          test -x "$DYNARE_PREPROCESSOR"
          echo "DYNARE_PATH=$DYNARE_PATH" >> "$GITHUB_ENV"

          SYSTEM_LIBSTDCXX="$(ldconfig -p | grep 'libstdc++.so.6' | grep 'x86-64' | awk '{print $NF; exit}')"
          test -f "$SYSTEM_LIBSTDCXX"
          strings "$SYSTEM_LIBSTDCXX" | grep -Fxq 'GLIBCXX_3.4.32'
          echo "SYSTEM_LIBSTDCXX=$SYSTEM_LIBSTDCXX" >> "$GITHUB_ENV"
          echo "System C++ runtime: $SYSTEM_LIBSTDCXX"
          dpkg-query -W -f='Dynare ${Version}\n' dynare
          dpkg-query -W -f='Dynare MATLAB support ${Version}\n' dynare-matlab

      - name: Set up Python for independent output validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all four model calibrations in MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            system_libstdcxx = getenv('SYSTEM_LIBSTDCXX');
            assert(isfile(system_libstdcxx), 'System C++ runtime was not found.');
            setenv('LD_PRELOAD', system_libstdcxx);
            assert(strcmp(version('-release'), '2024b'), 'This workflow requires MATLAB R2024b.');
            addpath(getenv('DYNARE_PATH'));
            fprintf('MATLAB release: %s\\n', version('-release'));
            fprintf('Preloaded C++ runtime: %s\\n', getenv('LD_PRELOAD'));
            run('replication/run_all.m');

      - name: Validate generated impulse responses
        run: python replication/validate_outputs.py

      - name: Upload generated results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynare-matlab-replication-${{ github.sha }}
          path: outputs/replication/
          if-no-files-found: warn
          retention-days: 30
